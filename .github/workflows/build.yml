name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Get Zygisk Header
        run: |
          # Download ONLY the header file directly from KernelSU repo
          mkdir -p zygisk
          curl -sL https://raw.githubusercontent.com/KernelSU/zygisk-module-template/master/zygisk/zygisk.hpp -o zygisk/zygisk.hpp
          ls -la zygisk/

      - name: Build with ndk-build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Force ndk-build to use current directory as project root
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

      - name: Prepare Output
        run: |
          mkdir -p output/zygisk
          cp libs/arm64-v8a/libzygisk.so output/zygisk/arm64-v8a.so
          cp libs/armeabi-v7a/libzygisk.so output/zygisk/armeabi-v7a.so
          
          echo "✅ Build Successful! Files generated:"
          ls -la output/zygisk/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellar-tweaks-zygisk-libs
          path: output/zygisk/
