name: Build Zygisk Module (ARM64 + ARM32)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone Zygisk Module Template
        run: |
          git clone --recursive https://github.com/KernelSU/zygisk-module-template.git template
          # Copy our fixed main.cpp into the template's zygisk folder
          cp zygisk/main.cpp template/zygisk/main.cpp

      - name: Build Libraries via Template Script
        working-directory: template
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # The official template includes a build.sh that handles both arm32 and arm64 automatically
          chmod +x build.sh
          ./build.sh

      - name: Prepare Output Folders
        run: |
          mkdir -p output/zygisk
          
          # The template outputs to specific build directories. 
          # We look for 'zygisk.so' which is the default output name.
          
          # Find and copy 64-bit .so
          find template -path "*arm64-v8a*" -name "zygisk.so" -exec cp {} output/zygisk/arm64-v8a.so \;
          
          # Find and copy 32-bit .so
          find template -path "*armeabi-v7a*" -name "zygisk.so" -exec cp {} output/zygisk/armeabi-v7a.so \;
          
          echo "Compiled libraries:"
          ls -laR output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-arm32-arm64-libraries
          path: output/zygisk/
