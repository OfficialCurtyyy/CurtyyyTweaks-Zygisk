name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone Zygisk Headers
        run: |
          git clone https://github.com/KernelSU/zygisk-module-template.git temp_template
          # Copy only the zygisk header folder to our jni directory so main.cpp can find it
          cp -r temp_template/zygisk jni/zygisk

      - name: Build with ndk-build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          $ANDROID_NDK_HOME/ndk-build

      - name: Prepare Output
        run: |
          mkdir -p output/zygisk
          # Copy 64-bit library
          cp libs/arm64-v8a/libzygisk.so output/zygisk/arm64-v8a.so
          # Copy 32-bit library
          cp libs/armeabi-v7a/libzygisk.so output/zygisk/armeabi-v7a.so
          
          echo "Build Successful!"
          ls -la output/zygisk/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellar-tweaks-zygisk-libs
          path: output/zygisk/
