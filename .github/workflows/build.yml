name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Diagnostics
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          echo "NDK path: $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/"

      - name: Build arm64-v8a + armeabi-v7a
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p output

          # 64-bit
          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -shared -fPIC -O2 -std=c++17 -static-libstdc++ \
            -Izygisk \
            zygisk/main.cpp \
            -o output/arm64-v8a.so

          # 32-bit
          "$TOOLCHAIN/armv7a-linux-androideabi24-clang++" \
            -shared -fPIC -O2 -std=c++17 -static-libstdc++ \
            -Izygisk \
            zygisk/main.cpp \
            -o output/armeabi-v7a.so

          echo "✅ Build finished:"
          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stellar-tweaks-zygisk
          path: output/
