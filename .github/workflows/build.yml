name: Build Zygisk Module (ARM64 + ARM32)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone Zygisk Module Template
        run: |
          git clone --recursive https://github.com/KernelSU/zygisk-module-template.git template
          # Overwrite template's main.cpp with our StellarTweaks code
          cp zygisk/main.cpp template/zygisk/main.cpp

      - name: Configure Architectures (32-bit + 64-bit)
        working-directory: template
        run: |
          # Force ndk-build to compile for BOTH arm64 and arm32
          echo "APP_ABI := arm64-v8a armeabi-v7a" > jni/Application.mk
          echo "APP_PLATFORM := android-24" >> jni/Application.mk
          echo "APP_STL := c++_static" >> jni/Application.mk

      - name: Build with ndk-build
        working-directory: template
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Run the compilation
          $ANDROID_NDK_HOME/ndk-build

      - name: Prepare Output Folders
        run: |
          mkdir -p output/zygisk
          
          # Copy the 64-bit library
          if [ -f template/libs/arm64-v8a/libzygisk_module.so ]; then
            cp template/libs/arm64-v8a/libzygisk_module.so output/zygisk/arm64-v8a.so
          fi
          
          # Copy the 32-bit library
          if [ -f template/libs/armeabi-v7a/libzygisk_module.so ]; then
            cp template/libs/armeabi-v7a/libzygisk_module.so output/zygisk/armeabi-v7a.so
          fi
          
          ls -la output/zygisk/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-arm32-arm64-libraries
          path: output/zygisk/
