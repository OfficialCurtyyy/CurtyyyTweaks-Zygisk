name: Build Zygisk Module (ARM64 + ARM32)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone Zygisk Module Template
        run: |
          git clone --recursive https://github.com/KernelSU/zygisk-module-template.git template
          # Copy our fixed main.cpp into the template
          cp zygisk/main.cpp template/zygisk/main.cpp

      - name: Build arm64-v8a (64-bit)
        working-directory: template
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build64 && cd build64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Build armeabi-v7a (32-bit)
        working-directory: template
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build32 && cd build32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Prepare Output Folders
        run: |
          mkdir -p output/zygisk
          
          # Find and copy 64-bit .so
          find template/build64 -name "*.so" -exec cp {} output/zygisk/arm64-v8a.so \;
          
          # Find and copy 32-bit .so
          find template/build32 -name "*.so" -exec cp {} output/zygisk/armeabi-v7a.so \;
          
          echo "Compiled libraries:"
          ls -la output/zygisk/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-arm32-arm64-libraries
          path: output/zygisk/
